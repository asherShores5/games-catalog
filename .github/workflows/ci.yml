name: CI / Deploy

# Tests on every push to main or prod and on PRs; pushes to prod also deploy (GitHub OIDC, no keys).
# Setup (names only, values live in GitHub settings): see docs/first-deploy.md.
#   secret   AWS_ACCOUNT_ID    masked in the public logs; the deploy role ARN is built from it
#   variable HOSTED_ZONE_ID    the existing Route 53 zone
#   variable HOSTED_ZONE_NAME  that zone's name
#   variable AWS_REGION        optional, defaults to us-west-1

on:
  push:
    branches: [main, prod]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

# Actions are pinned to commit SHAs: a moved tag can't change what runs next to AWS credentials.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC -> AWS
      contents: read
    env:
      # Read by infra/lib/config.ts. requireHosting (set by `npm run deploy`) fails the deploy if a
      # value is missing instead of quietly deploying without hosting.
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/games-catalog-github-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}
          mask-aws-account-id: true
      - run: npm run deploy
