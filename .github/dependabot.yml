# Monthly, grouped: one PR per ecosystem with every update, so security fixes arrive without noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
    open-pull-requests-limit: 2
