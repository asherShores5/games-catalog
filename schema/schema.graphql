schema {
  query: Query
  mutation: Mutation
}

"Digital or Physical."
enum Format {
  Digital
  Physical
}

"Playing, Backlog or Finished. A null Play status means none."
enum PlayStatus {
  Playing
  Backlog
  Finished
}

"The hardware a Copy runs on (PC, PS5, Switch...). An editable list."
type Platform {
  id: ID!
  name: String!
}

"Where Digital Copies are bought. A fixed set."
enum Store {
  Steam
  Epic
  GOG
  PSN
  Xbox
  Nintendo
  Other
}

"One login on a Store with a nickname, e.g. Steam: main. The Store is fixed once created."
type Account {
  id: ID!
  store: Store!
  nickname: String!
  "Whether a Steam ID is set (Steam Accounts only). The Steam ID itself is never returned."
  hasSteamId: Boolean!
}

"One way a Game is owned. platformId and accountId point into their lists, so a rename follows. An Unknown Copy (from the Seed) has a null platformId and format until it is filled in."
type Copy {
  id: ID!
  platformId: ID
  format: Format
  "The Account of a Digital Copy. Null on Physical Copies (and on Digital Copies saved before Accounts)."
  accountId: ID
  edition: String
  createdAt: Float!
}

"One title, however many ways it is owned. See GLOSSARY.md."
type Game {
  id: ID!
  name: String!
  "Every Copy, oldest first."
  copies: [Copy!]!
  "Derived: at least one Copy. Never set by hand."
  owned: Boolean!
  wishlist: Boolean!
  playStatus: PlayStatus
  "The Steam app this Game matches, once a Steam Import created or matched it."
  steamAppId: Int
  createdAt: Float!
  updatedAt: Float!
}

"What an Import from Steam did."
type SteamImportSummary {
  "Games that got a new Copy on the Account."
  added: Int!
  "Library games that already had a Copy on the Account."
  alreadyPresent: Int!
  "Names of the added Games, in name order."
  addedNames: [String!]!
  "Library entries that couldn't be saved this time; re-running retries them."
  failed: Int!
}

type Query {
  "The signed-in owner's Games with their Copies, in name order."
  games: [Game!]!
  "The owner's Platforms in name order, seeded with common ones on first use."
  platforms: [Platform!]!
  "The owner's Accounts, ordered by Store: nickname."
  accounts: [Account!]!
}

type Mutation {
  "Add a Game by name (trimmed, 1-200 characters)."
  addGame(name: String!): Game!
  "Add a Copy. Digital needs accountId, Physical must not have one. On a Wishlist Game this clears Wishlist and sets Play status to Backlog."
  addCopy(gameId: ID!, platformId: ID!, format: Format!, accountId: ID, edition: String): Game!
  "Give an Unknown Copy its Platform and Format (same Account rule as addCopy). The Copy keeps its id."
  fillUnknownCopy(gameId: ID!, copyId: ID!, platformId: ID!, format: Format!, accountId: ID, edition: String): Game!
  "Remove a Copy. Removing the last one makes the Game not Owned."
  removeCopy(gameId: ID!, copyId: ID!): Game!
  "Set Play status, or null for none."
  setPlayStatus(gameId: ID!, playStatus: PlayStatus): Game!
  "Put an unowned Game on the Wishlist (true) or take any Game off it (false)."
  setWishlist(gameId: ID!, wishlist: Boolean!): Game!

  "Add a Platform (trimmed, 1-50 characters, unique ignoring case)."
  addPlatform(name: String!): Platform!
  renamePlatform(id: ID!, name: String!): Platform!
  "Delete a Platform no Copy uses. Returns its id."
  deletePlatform(id: ID!): ID!

  "Add an Account (nickname trimmed, 1-50 characters, unique per Store ignoring case)."
  addAccount(store: Store!, nickname: String!): Account!
  "Rename an Account's nickname. Its Copies show the new name; they aren't rewritten."
  renameAccount(id: ID!, nickname: String!): Account!
  "Delete an Account no Copy uses. Returns its id."
  deleteAccount(id: ID!): ID!
  "Set (or clear, with null) a Steam Account's Steam ID: the 17-digit SteamID64."
  setSteamId(accountId: ID!, steamId: String): Account!
  "Import the Steam Account's library: adds Games and Digital PC Copies, never removes or edits manual ones."
  importSteam(accountId: ID!): SteamImportSummary!
}
